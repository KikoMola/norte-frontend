openapi: 3.1.0
info:
  title: Norte API
  version: 0.1.0
  summary: CRM + ERP para pymes españolas.
  description: |
    Contrato de la API de Norte. Es la fuente de verdad: el backend genera sus interfaces de Spring y el frontend su
    cliente y sus mocks a partir de este fichero. Las reglas de estilo están en `api/README.md`.

    El navegador no llama a esta API directamente: pasa por el BFF, que añade el access token. Por eso el esquema de
    seguridad es `bearerAuth` aunque la SPA solo use una cookie de sesión.
servers:
  - url: /api/v1
    description: A través del BFF (mismo origen que la SPA)
security:
  - bearerAuth: []
tags:
  - name: session
    description: Sesión del usuario actual
  - name: companies
    description: Empresas (maestro de terceros, módulo `parties`)

paths:
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: Usuario y tenant de la sesión actual
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                ana:
                  $ref: '#/components/examples/MeAna'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /companies:
    get:
      tags: [companies]
      operationId: listCompanies
      summary: Lista las empresas del tenant
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Busca por nombre o NIF (sin distinguir mayúsculas).
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          description: Campo de ordenación; con `-` delante es descendente.
          schema:
            type: string
            enum: [name, -name, createdAt, -createdAt]
            default: name
      responses:
        '200':
          description: Página de empresas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
              examples:
                firstPage:
                  $ref: '#/components/examples/CompanyPageFirst'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [companies]
      operationId: createCompany
      summary: Da de alta una empresa
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
            examples:
              acme:
                value:
                  name: Acme Ibérica S.L.
                  taxId: B12345674
      responses:
        '201':
          description: Empresa creada
          headers:
            Location:
              description: URL de la empresa creada
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
              examples:
                acme:
                  $ref: '#/components/examples/CompanyAcme'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [companies]
      operationId: getCompany
      summary: Detalle de una empresa
      responses:
        '200':
          description: Empresa
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
              examples:
                acme:
                  $ref: '#/components/examples/CompanyAcme'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Keycloak (realm `norte`, audiencia `norte-api`). Lo añade el BFF.

  headers:
    ETag:
      description: Versión del recurso. Se devuelve en `If-Match` para actualizar sin pisar cambios ajenos.
      schema:
        type: string
        example: '"3"'

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto en `pageInfo.nextCursor`. Sin cursor, primera página.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Tamaño de página.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Identificador único de la petición, generado por el cliente (UUID). Reintentar con la misma clave devuelve la
        misma respuesta sin repetir el efecto.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión que se quiere modificar. Si no coincide, 412.
      schema:
        type: string
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Petición mal formada (parámetros o JSON inválidos)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No hay sesión o el token no es válido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El usuario no tiene permiso para esta acción
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: El recurso no existe o no pertenece al tenant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto con el estado actual (por ejemplo, NIF duplicado)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            duplicateTaxId:
              $ref: '#/components/examples/ProblemDuplicateTaxId'
    PreconditionFailed:
      description: El `If-Match` no coincide con la versión actual
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Reglas de validación incumplidas; el detalle va en `errors`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidTaxId:
              $ref: '#/components/examples/ProblemInvalidTaxId'
    UnexpectedError:
      description: Error inesperado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Error en formato Problem Details (RFC 9457). Catálogo de códigos en `docs/errores.md`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI que identifica el tipo de error.
          examples: ['https://norte.dev/problems/validation']
        title:
          type: string
          description: Resumen legible del tipo de error.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explicación de esta ocurrencia concreta.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código estable para el frontend y las traducciones (`company.tax_id.duplicate`).
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        traceId:
          type: string
          description: Identificador de la traza en Tempo.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Ruta del campo en el cuerpo (`taxId`, `lines[2].quantity`).
        code:
          type: string
          description: Código estable del error de validación (`required`, `tax_id.invalid`).
        message:
          type: string
          description: Mensaje por defecto en español; el frontend traduce a partir de `code`.

    PageInfo:
      type: object
      required: [hasNext]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Cursor de la página siguiente; `null` si no hay más.
        hasNext:
          type: boolean

    Money:
      type: object
      description: Importe con su moneda. El importe va como string decimal para no perder precisión.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          examples: ['1210.00']
        currency:
          type: string
          description: Código ISO 4217.
          pattern: '^[A-Z]{3}$'
          examples: [EUR]

    Address:
      type: object
      required: [line1, postalCode, city, country]
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        postalCode:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        country:
          type: string
          description: Código ISO 3166-1 alfa-2.
          pattern: '^[A-Z]{2}$'
          examples: [ES]

    AuditEvent:
      type: object
      description: Cambio registrado en el historial de un recurso.
      required: [id, occurredAt, action, actor]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          enum: [created, updated, deleted]
        actor:
          type: object
          required: [id]
          properties:
            id:
              type: string
            name:
              type: string
        changes:
          type: array
          items:
            type: object
            required: [field]
            properties:
              field:
                type: string
              from: {}
              to: {}

    Me:
      type: object
      required: [id, username, tenantId, roles]
      properties:
        id:
          type: string
          description: Identificador del usuario en Keycloak (`sub`).
        username:
          type: string
        name:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        tenantId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string

    CompanyCreate:
      type: object
      additionalProperties: false
      required: [name, taxId]
      properties:
        name:
          type: string
          description: Razón social.
          minLength: 1
          maxLength: 200
        taxId:
          type: string
          description: NIF, NIE o CIF español. Se normaliza a mayúsculas sin espacios ni guiones.
          minLength: 9
          maxLength: 15

    Company:
      type: object
      required: [id, name, taxId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        taxId:
          type: string
          description: NIF normalizado.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CompanyPage:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

  examples:
    MeAna:
      value:
        id: b7470b47-3687-4ad2-bc0a-d67c970118a3
        username: ana
        name: Ana Acme
        email: ana@acme.test
        tenantId: 11111111-1111-1111-1111-111111111111
        roles: [admin, user]
    CompanyAcme:
      value:
        id: 0b6f1c3e-9a43-4d0e-8f1e-7f6a2b1c9d10
        name: Acme Ibérica S.L.
        taxId: B12345674
        createdAt: '2026-11-24T09:30:00Z'
        updatedAt: '2026-11-24T09:30:00Z'
    CompanyPageFirst:
      value:
        items:
          - id: 0b6f1c3e-9a43-4d0e-8f1e-7f6a2b1c9d10
            name: Acme Ibérica S.L.
            taxId: B12345674
            createdAt: '2026-11-24T09:30:00Z'
            updatedAt: '2026-11-24T09:30:00Z'
          - id: 5d2e7a90-3c1b-4f6e-a8d2-1e9b0c4f7a32
            name: Globex Levante S.A.
            taxId: A58818501
            createdAt: '2026-11-23T16:05:00Z'
            updatedAt: '2026-11-23T16:05:00Z'
        pageInfo:
          nextCursor: null
          hasNext: false
    ProblemInvalidTaxId:
      value:
        type: https://norte.dev/problems/validation
        title: Datos no válidos
        status: 422
        code: validation
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - field: taxId
            code: tax_id.invalid
            message: El NIF no es válido.
    ProblemDuplicateTaxId:
      value:
        type: https://norte.dev/problems/company-tax-id-duplicate
        title: Ya existe una empresa con ese NIF
        status: 409
        code: company.tax_id.duplicate
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
